# Deploys to Firebase Hosting (production) when code lands on main.
name: Deploy to Firebase Hosting on merge

'on':
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Firestore rules are deployed by hand, so they get their own gate. These
  # tests assert real allow/deny behaviour against the emulator, which is the
  # only way to catch a rule that compiles with a warning yet denies every
  # write at runtime.
  rules_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static rules check
        run: npm run verify:rules

      - name: Rules checker self-test
        run: npm run verify:rules:self-test

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  build_and_deploy:
    needs: rules_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Catches Firestore rules that would silently deny writes at runtime
      # (e.g. Realtime-Database-only functions) and reaction allowlist drift.
      - name: Verify Firestore rules
        run: npm run verify:rules

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          REACT_APP_FIREBASE_API_KEY: '${{ secrets.REACT_APP_FIREBASE_API_KEY }}'
          REACT_APP_FIREBASE_AUTH_DOMAIN: '${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}'
          REACT_APP_FIREBASE_PROJECT_ID: '${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}'
          REACT_APP_FIREBASE_STORAGE_BUCKET: '${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}'
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: '${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}'
          REACT_APP_FIREBASE_APP_ID: '${{ secrets.REACT_APP_FIREBASE_APP_ID }}'
          REACT_APP_FIREBASE_MEASUREMENT_ID: '${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}'

      # Guards against shipping an empty bundle: a CRA build still succeeds when
      # the entry module is blank, which produces a blank page in production.
      - name: Verify build output is not empty
        run: npm run verify:build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AK_CHAT_SERVER }}'
          channelId: live
          projectId: ak-chat-server
